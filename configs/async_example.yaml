# Production 8-core slice: 6 DRI + 1 BG-AILS + 1 SP.
# Merges on top of configs/default.yaml (greedy + k, initial_omega 10, divisor 35).

cores:
  total: 8
  dri: 6
  bg: 1
  sp: 1
  # Optional explicit pin; otherwise pass --cpus 0-7
  # cpu_list: [0, 1, 2, 3, 4, 5, 6, 7]

bg_ails:
  mode: async
  crash_threshold: 1

sp_sc:
  mode: async
  trigger: wallclock
  interval_minutes: 20.0
  overlap_policy: skip
  warmup_iterations: 5
  sp_interval: 3
  min_coverage: 5
  sp_time_limit: 720.0
  mip_gap: 0.00025
