# Example: async SC/SP on a reserved core
# Merge on top of configs/default.yaml when passed as --config.

cores:
  total: 8
  dri: 7
  sp: 1
  # Optional explicit pin; otherwise pass --cpus 0-7
  # cpu_list: [0, 1, 2, 3, 4, 5, 6, 7]

sp_sc:
  mode: async
  trigger: wallclock          # async-only; first fire after warmup
  interval_minutes: 20.0
  overlap_policy: skip
  warmup_iterations: 5       # always gates every trigger
  sp_interval: 3              # used if trigger: iteration
  min_coverage: 5
  sp_time_limit: 600.0
  mip_gap: 0.0005
