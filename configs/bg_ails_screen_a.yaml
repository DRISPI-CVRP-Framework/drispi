# Screen A — BG-AILS pair_selection × n_chains_mode (2×2)
#
# Async 6+1+1, SP/SC off, omega frozen at 1 (repair mode). Pair selection and
# n_chains_mode are set per variant by scripts/run_bg_ails_screen_a.py.
# Merges on top of configs/default.yaml.

time_limit: 7200.0           # 2 h; orchestrator --duration-hours wins
max_no_improve: 1000000000   # time_limit only
run_analysis: false
output_dir: "artifacts/bg_ails_screen_a/runs"

cores:
  total: 8
  dri: 6
  bg: 1
  sp: 1                      # reserved for 8-wide packing; SP worker is not started
  # cpu_list supplied per slice via --cpus

bg_ails:
  mode: async
  crash_threshold: 1
  initial_omega: 1.0         # clamp floor; do not grid values in (0, 1]

sp_sc:
  mode: "off"                # quoted: YAML 1.1 otherwise parses off as false
