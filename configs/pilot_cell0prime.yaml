# Post-pilot confirmation — cell 0': campaign-era domain via config.
# k=1 is included only here; ext_per_1000: 0 is a no-op (no geometric
# extension), not a drop-low filter. Merges on top of configs/default.yaml.
#
# Domain at the confirmation instances (n=7037 / 8028 / 10001):
#   1, 2, 3, 4, 6, 8, 10, 12

time_limit: 7200.0
max_no_improve: 1000000000
run_analysis: false
output_dir: "artifacts/pilot/cell0prime/runs"

cores:
  total: 8
  dri: 6
  bg: 1
  sp: 1

decomposition:
  k_domain:
    base_arms: [1, 2, 3, 4, 6, 8, 10, 12]
    ext_per_1000: 0

bg_ails:
  mode: async
  crash_threshold: 1

sp_sc:
  mode: async
  trigger: wallclock
  interval_minutes: 20.0
  overlap_policy: skip
  warmup_iterations: 5
  sp_interval: 3
  min_coverage: 5
  sp_time_limit: 720.0
  mip_gap: 0.00025
