# 12 h pilot archive — cell A: drop-low only (k_lo filter + extend-high OFF).
# Frozen snapshot of the stage-1 image. Do not reuse as a confirmation profile:
# k_lo is gone, and ext_per_1000: 0 is now a clean no-op (full base, no
# geometric extension) rather than "drop-low".
# Merges on top of configs/default.yaml.
#
# Resulting k domains for the pilot instances:
#   XL-n8028-k294   -> [6, 8, 10, 12]
#   XL-n10001-k1570 -> [8, 10, 12]

time_limit: 7200.0
max_no_improve: 1000000000
run_analysis: false
output_dir: "artifacts/pilot/cellA/runs"

cores:
  total: 8
  dri: 6
  bg: 1
  sp: 1

decomposition:
  k_domain:
    ext_per_1000: 0   # archive: disabled extension on the stage-1 image (k_lo was still applied then)

bg_ails:
  mode: async
  crash_threshold: 1

sp_sc:
  mode: async
  trigger: wallclock
  interval_minutes: 20.0
  overlap_policy: skip
  warmup_iterations: 5
  sp_interval: 3
  min_coverage: 5
  sp_time_limit: 720.0
  mip_gap: 0.00025
