# Stage-1 pilot — cell B: full scale-adaptive k domain (drop-low + extend-high).
# Run on the stage-1 image. Identical to final_benchmark.yaml (defaults already
# give the full k_domain); merges on top of configs/default.yaml.
#
# Resulting k domains for the pilot instances:
#   XL-n8028-k294   -> [6, 8, 10, 12, 15, 19, 24, 30, 38, 48]
#   XL-n10001-k1570 -> [8, 10, 12, 15, 19, 24, 30, 38, 48, 60]

time_limit: 7200.0
max_no_improve: 1000000000
run_analysis: false
output_dir: "artifacts/pilot/cellB/runs"

cores:
  total: 8
  dri: 6
  bg: 1
  sp: 1

bg_ails:
  mode: async
  crash_threshold: 1

sp_sc:
  mode: async
  trigger: wallclock
  interval_minutes: 20.0
  overlap_policy: skip
  warmup_iterations: 5
  sp_interval: 3
  min_coverage: 5
  sp_time_limit: 720.0
  mip_gap: 0.00025
