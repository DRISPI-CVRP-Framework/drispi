# Post-pilot confirmation — cell C4: full 7-arm base, ext_per_1000: 4.
# Cap is an experimental factor; C6 is the shipping default.
# Merges on top of configs/default.yaml.
#
# Resulting k domains:
#   XL-n7037-k38    -> [2, 3, 4, 6, 8, 10, 12, 16, 21, 28]
#   XL-n8028-k294   -> [2, 3, 4, 6, 8, 10, 12, 17, 23, 32]
#   XL-n10001-k1570 -> [2, 3, 4, 6, 8, 10, 12, 18, 27, 40]

time_limit: 7200.0
max_no_improve: 1000000000
run_analysis: false
output_dir: "artifacts/pilot/cellC4/runs"

cores:
  total: 8
  dri: 6
  bg: 1
  sp: 1

decomposition:
  k_domain:
    ext_per_1000: 4

bg_ails:
  mode: async
  crash_threshold: 1

sp_sc:
  mode: async
  trigger: wallclock
  interval_minutes: 20.0
  overlap_policy: skip
  warmup_iterations: 5
  sp_interval: 3
  min_coverage: 5
  sp_time_limit: 720.0
  mip_gap: 0.00025
