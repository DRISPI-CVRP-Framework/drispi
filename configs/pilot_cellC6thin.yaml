# Post-pilot confirmation — cell C6-thin: base {2,4,8,12} + ext_per_1000: 6.
# Frees three extension slots vs C6. Do not ship this as default.yaml on the
# basis of the confirmation arithmetic; mid-n (n≈3000) degenerates to
# consecutive integers (risk 8). Merges on top of configs/default.yaml.
#
# Resulting k domains:
#   XL-n7037-k38    -> [2, 4, 8, 12, 15, 18, 21, 26, 31, 38]
#   XL-n8028-k294   -> [2, 4, 8, 12, 15, 19, 24, 30, 38, 48]
#   XL-n10001-k1570 -> [2, 4, 8, 12, 16, 21, 27, 35, 46, 60]

time_limit: 7200.0
max_no_improve: 1000000000
run_analysis: false
output_dir: "artifacts/pilot/cellC6thin/runs"

cores:
  total: 8
  dri: 6
  bg: 1
  sp: 1

decomposition:
  k_domain:
    base_arms: [2, 4, 8, 12]
    ext_per_1000: 6

bg_ails:
  mode: async
  crash_threshold: 1

sp_sc:
  mode: async
  trigger: wallclock
  interval_minutes: 20.0
  overlap_policy: skip
  warmup_iterations: 5
  sp_interval: 3
  min_coverage: 5
  sp_time_limit: 720.0
  mip_gap: 0.00025
