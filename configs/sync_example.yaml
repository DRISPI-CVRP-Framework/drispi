# Example: sync SC/SP (explicit; same as dataclass defaults for mode/trigger)
# Merge on top of configs/default.yaml when passed as --config.

# Optional: reserve cores so Gurobi uses cores.sp threads during the
# blocking SC/SP phase (SP core idle during DRI).
# cores:
#   total: 8
#   dri: 7
#   sp: 1

sp_sc:
  mode: sync
  trigger: iteration
  warmup_iterations: 10
  sp_interval: 3
  min_coverage: 5
  sp_time_limit: 600.0
  mip_gap: 0.0005
